# =============================================================================
# 本地开发覆盖（Compose 自动合并，无需额外 -f 参数）
#
# 原因：本机网络无法直连 quay.io（返回 401 Unauthorized），而 MinIO 官方同时
# 在 Docker Hub 发布同名镜像。这里把 minio / mc 指向 Docker Hub 上的等价镜像，
# 功能一致，仅替换镜像来源。
#
# 该文件是本地环境适配，不应提交到仓库。
# =============================================================================

services:
  minio:
    image: minio/minio:latest

  minio-init:
    image: minio/mc:latest
